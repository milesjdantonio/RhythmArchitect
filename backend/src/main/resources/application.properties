spring.application.name=backend
server.port=${PORT:8080}

# The song bank (a JSON file, the same shape as the mock's frontend/.data/songs.json).
# Seeded with the built-in songs (src/main/resources/seed/songs.json) the first time.
rythm.songs-file=${SONGS_FILE:.data/songs.json}

# The app's dev and preview servers, which call this backend from another port.
rythm.cors.origins=${CORS_ORIGINS:http://localhost:*}

# Finding songs on YouTube by name (pasted links need no key).
rythm.youtube.api-key=${YOUTUBE_API_KEY:}

# The AI charter (POST /api/chart). Without a key it answers 501 and the app uses its own charts.
rythm.anthropic.api-key=${ANTHROPIC_API_KEY:}
rythm.charter.model=${CHARTER_MODEL:claude-opus-5-5}
rythm.charter.effort=${CHARTER_EFFORT:high}
rythm.charter.max-tokens=64000
# The app waits 300 s for a plan; each Claude call may take up to this long.
rythm.charter.timeout-seconds=270
rythm.charter.per-hour=${CHARTER_PER_HOUR:20}
# The streamed chart answer (progress lines, then the plan) stays open while Claude works.
spring.mvc.async.request-timeout=320s

# Songs mapped by listening carry their charts and a loudness curve: allow big bodies.
server.tomcat.max-swallow-size=8MB
spring.servlet.multipart.enabled=false
